# Boost F1 — Railway (https://github.com/SDK432/boost-f1)
# Next.js listens on $PORT via `next start`.

[build]
builder = "RAILPACK"
buildCommand = "npm run build"

[deploy]
startCommand = "npm run start"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
